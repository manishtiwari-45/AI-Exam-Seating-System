# =============================================================
# Exam Seating Allocation System ? Application Configuration
# =============================================================
#
# HOW ENVIRONMENT VARIABLES WORK:
#   DBConnection.java reads these properties at startup.
#   If an environment variable with the same name exists,
#   it takes priority over the value written here.
#
#   This means:
#     - Local dev: edit the values below directly
#     - Production (Railway/Render): set env vars in the dashboard
#       and never touch this file
#
# =============================================================

# --- Database ---
# Local development defaults (change to your local MySQL setup)
DB_HOST=localhost
DB_PORT=3306
DB_NAME=exam_seating_db
DB_USER=root
DB_PASS=2578

# --- Connection Pool (HikariCP) ---
# Maximum number of DB connections kept alive in the pool.
# For a single-server demo, 5 is more than enough.
DB_POOL_SIZE=5

# Connection timeout in milliseconds (30 seconds)
DB_TIMEOUT_MS=30000

# --- Server ---
# Port the HTTP server listens on.
# Railway overrides this with its own PORT env variable.
PORT=8080

# --- AI Integration ---
# Your Anthropic API key for the /api/analyze endpoint.
# Get one from: https://console.anthropic.com
# NEVER commit a real key here ? always use an env variable in production.
ANTHROPIC_API_KEY=your_anthropic_key_here